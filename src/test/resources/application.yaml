# ============================================================================
#  Configuración de Ventas-Backend
# ----------------------------------------------------------------------------
#  REGLA DE ORO PARA GIT:
#   Este archivo SÍ se sube al repositorio, pero DEBE permanecer SIN secretos.
#   Todos los valores sensibles se inyectan por VARIABLES DE ENTORNO (${...})
#   o desde application-local.yaml (libro: ignorado por git, ver .gitignore).
#
#  ¿DÓNDE VIVEN LOS VALORES DE ${DB_USER} / ${DB_PASSWORD} / etc.?
#   - EN LOCAL (dev)        : dentro de src/main/resources/application-local.yaml
#                             (archivo NO versionado, solo en tu máquina).
#   - EN PRODUCCIÓN (Railway): en las "Variables" de entorno del servicio
#                             (interfaz web de Railway o el archivo .env).
#
#  ORDEN DE PRECEDENCIA QUE USA SPRING PARA RESOLVER ${...} (mayor gana):
#    1. Variables de entorno del sistema / de Railway
#    2. application-local.yaml (perfil "local" activo por defecto)
#    3. application.yaml (este archivo, valores por defecto tipo «:» )
#
#  Si una variable no tiene «:default» y tampoco se resuelve, la app NO arranca
#  (falla rápido). Eso es intencional: evita corre con valores vacíos.
# ============================================================================
spring:
  application:
    name: compras

  # Perfil activo por defecto: "local". Así, al arrancar en tu máquina se carga
  # application-local.yaml (que contiene tus credenciales reales de dev).
  # En Railway ese archivo NO existe, así que las variables se toman desde el
  # entorno de Railway directamente.
  profiles:
    default: local

  datasource:
    # Host, puerto y nombre de BD NO son secretos → tienen default. Usuario y
    # clave vienen de ${DB_USER} / ${DB_PASSWORD} (local o Railway).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:compras_db}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  flyway:
    enabled: false # true Los tests no corren migraciones ni las buscan. Usar true cuando se ejecuta por primera vez.

  jpa:
    hibernate:
      # update (dev): crea/actualiza tablas automáticamente. Para producción real
      # usar "validate" -> Hibernate NO modifica el esquema, solo lo valida.
      ddl-auto: create-drop
    # false en producción (evita exponer SQL con datos en logs).
    # true por defecto para tu desarrollo local.
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    # SMTP de Gmail con credenciales desde variable/env (nunca hardcodeadas).
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  # URL del frontend (Angular). Se usa en los emails de recuperación de contraseña.
  #   Local      : http://localhost:4200
  #   Netlify    : https://tu-app.netlify.app   -> via FRONTEND_URL
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  # Control del SEED inicial de roles/permisos/admin (bootstraps).
  #   true  (default) : crea roles si la tabla está vacía, crea permisos
  #                     faltantes, crea el admin inicial y reasigna permisos.
  #   false           : los bootstraps NO tocan roles/permisos/usuarios.
  #                     Útil en producción o cuando quieres controlar todo a mano.
  seed-bootstraps: ${APP_SEED_BOOTSTRAPS:true}
  # Carpeta física donde se guardan las imágenes de productos.
  #   Local   : ./uploads (default)
  #   Railway : via UPLOAD_DIR apuntando al VOLUMEN persistente montado, p. ej.
  #             /app/uploads -> navega a Railway -> Project -> el servicio ->
  #             Volumes tab -> crea un volumen con monte en /app/uploads, y
  #             define UPLOAD_DIR=/app/uploads e UPLOAD_URL=https://<tu-app>.
  upload-dir: ${UPLOAD_DIR:./uploads}
  # URL BASE pública con la que el frontend construye las rutas de imágenes:
  #   Local   : http://localhost:8081/api/uploads
  #   Railway : https://tu-backend.up.railway.app/api/uploads  -> via UPLOAD_URL
  upload-url: ${UPLOAD_URL:http://localhost:8081/api/uploads}

server:
  # Railway inyecta un puerto aleatorio en $PORT. En local usa el 8081.
  port: ${PORT:8081}

payment:
  terminal:
    # SIMULATED (dev/demo) o PHYSICAL (Socket TCP con terminal real).
    type: ${PAYMENT_TERMINAL_TYPE:SIMULATED}
    host: ${TERMINAL_HOST:192.168.1.100}
    port: ${TERMINAL_PORT:8080}
    merchant-id: ${PAYMENT_MERCHANT_ID}
    terminal-id: ${PAYMENT_TERMINAL_ID}
    timeout: ${TERMINAL_TIMEOUT:30}
    ssl-enabled: ${TERMINAL_SSL_ENABLED:true}
    keystore-path: ${TERMINAL_KEYSTORE_PATH:/certs/terminal.jks}
    keystore-password: ${PAYMENT_KEYSTORE_PASSWORD}
    simulation:
      mode: ${TERMINAL_SIMULATION_MODE:DETERMINISTIC}
      failure-rate: ${TERMINAL_FAILURE_RATE:0.10}
      response-delay: ${TERMINAL_RESPONSE_DELAY:500}